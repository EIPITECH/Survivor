services:
  frontend:
    container_name: astro-frontend
    build:
      context: ./front
    ports:
      - "4321:4321"
    networks:
      - bridge
    depends_on:
      - backend

  backend:
    container_name: nest-backend
    build:
      context: ./backend
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - db
    # volumes:
    #   - wmts:/var/lib/postgresql/data
    networks:
      - bridge
      - backtier
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  db:
    image: postgres:13
    container_name: ${DB_HOST}
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backtier

volumes:
  postgres-data:
  # wmts:

networks:
  bridge:
  backtier:
