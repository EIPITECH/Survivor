services:
  frontend:
    container_name: astro-frontend
    image: astro-frontend:latest
    build:
      context: ./front
    ports:
      - "4321:4321"
    networks:
      - bridge
    depends_on:
      - backend

  backend:
    container_name: nest-backend
    image: nest-backend:latest
    build:
      context: ./backend
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - wmts-cache:/data/wmts-cache
    networks:
      - bridge
      - backtier
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 5m
      timeout: 200ms
      retries: 3
      start_period: 60s

  db:
    image: postgres:13
    container_name: ${DB_HOST}
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backtier
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 5s

  k6:
    image: grafana/k6:latest
    container_name: k6-load-test
    profiles: ["loadtest"]
    volumes:
      - ./k6:/scripts
      - ./k6/reports:/reports
    environment:
      BASE_URL: "http://backend:3000"
      POOL_SIZE: ${K6_POOL_SIZE:-30}
      LOGIN_VUS: ${K6_LOGIN_VUS:-10}
      LOGIN_DURATION: ${K6_LOGIN_DURATION:-30s}
      JOBS_READ_VUS: ${K6_JOBS_READ_VUS:-20}
      JOBS_READ_DURATION: ${K6_JOBS_READ_DURATION:-30s}
      TILES_VUS: ${K6_TILES_VUS:-15}
      TILES_DURATION: ${K6_TILES_DURATION:-30s}
      PROFILE_VUS: ${K6_PROFILE_VUS:-10}
      PROFILE_DURATION: ${K6_PROFILE_DURATION:-30s}
      APPFLOW_VUS: ${K6_APPFLOW_VUS:-10}
      APPFLOW_DURATION: ${K6_APPFLOW_DURATION:-30s}
    working_dir: /scripts
    entrypoint: ["k6", "run"]
    command: ["main.js"]
    depends_on:
      - backend
    networks:
      - bridge

volumes:
  postgres-data:
  wmts-cache:

networks:
  bridge:
  backtier:
